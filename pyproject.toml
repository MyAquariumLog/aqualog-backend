[project]
name = "aqualog-api"
version = "0.14.1"
description = "AquaLog Backend API"
authors = [
    {name = "Cylindric",email = "mark@hanfordonline.co.uk"}
]
readme = "README.md"
requires-python = ">=3.10,<4.0"

dependencies = [
    "alembic~=1.17.1",
    "authlib~=1.7.2",
    "fastapi~=0.139.2",
    "httpx2 (>=2.9.1,<3.0.0)",
    "psycopg[binary]~=3.2.11",
    "pydantic-settings~=2.14.2",
    "sqlalchemy~=2.0.43",
    "starlette~=1.3.1",
    "uvicorn~=0.51.0",
]

[dependency-groups]
dev = [
    "commitizen (>=4.16.4,<4.17.0)",
    "mypy~=1.19.1",
    "pre-commit~=4.4.0",
    "pytest-asyncio>=1.3.0,<2.0.0",
    "pytest-cov>=7.1.0,<8.0.0",
    "pytest-html>=4.2.0,<5.0.0",
    "pytest~=9.0.3",
    "ruff~=0.14.5",
]

[tool.poetry]
package-mode = false

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_scheme = "pep440"
version_provider = "pep621"
update_changelog_on_bump = true
major_version_zero = false

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "alembic"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "S",    # flake8-bandit (security)
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
]
ignore = [
    "E501", # line length is handled by the formatter
]

[tool.ruff.lint.per-file-ignores]
# tests use assert freely and construct dummy tokens/secrets
"tests/*" = ["S101", "S105", "S106"]
# autogenerated migrations aren't hand-reviewed line-by-line
"alembic/versions/*" = ["E501", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom requires calling Depends()/Body()/Query()
# as argument defaults; these are safe, framework-recognized exceptions to B008.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Body", "fastapi.Query"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
explicit_package_bases = true
namespace_packages = true
ignore_missing_imports = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = "alembic.*"
ignore_errors = true

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
